[project]
name = "yottaflex-workspace"
version = "0.1.0"
description = "Support Ticket Routing & SLA Intelligence Platform — monorepo workspaces"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
