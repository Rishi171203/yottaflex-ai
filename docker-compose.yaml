services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yottaflex
      POSTGRES_PASSWORD: yottaflex_dev
      POSTGRES_DB: yottaflex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yottaflex -d yottaflex"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://yottaflex:yottaflex_dev@postgres:5432/yottaflex
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
